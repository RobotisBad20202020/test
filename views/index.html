<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Text Extractor</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #extractedOutput { 
            width: 90%; 
            height: 400px; 
            margin-top: 15px; 
            border: 1px solid #ccc; 
            padding: 10px; 
            white-space: pre-wrap; /* Preserve formatting */
            overflow-y: scroll; 
        }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Upload PDF to Extract Text</h1>

    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="pdfFile" accept=".pdf" required>
        <button type="submit">Upload and Extract</button>
    </form>

    <h2>Extracted Text:</h2>
    <div id="status"></div> 
    <textarea id="extractedOutput" readonly></textarea> 

    <script>
        // This code runs every time index.html loads
        document.addEventListener('DOMContentLoaded', () => {
            const outputArea = document.getElementById('extractedOutput');
            const statusDiv = document.getElementById('status');
            
            // Check for an error message first
            const errorMessage = localStorage.getItem('extractionError');
            if (errorMessage) {
                console.error("Extraction Error:", decodeURIComponent(errorMessage));
                statusDiv.textContent = `Error: ${decodeURIComponent(errorMessage)}`;
                statusDiv.className = 'error'; // Apply error styling
                outputArea.value = ''; // Clear output area
                localStorage.removeItem('extractionError'); // Clear the error message after displaying
            } else {
                 // Check for extracted text
                const storedText = localStorage.getItem('extractedText');
                if (storedText) {
                    try {
                        // Decode the text retrieved from localStorage
                        outputArea.value = decodeURIComponent(storedText);
                        statusDiv.textContent = 'Text extracted successfully.';
                        statusDiv.className = ''; // Clear any previous error styling
                        // Clear the stored text after displaying it so it doesn't reappear on refresh
                        localStorage.removeItem('extractedText'); 
                    } catch (e) {
                        console.error("Error decoding stored text:", e);
                        statusDiv.textContent = 'Error displaying stored text.';
                        statusDiv.className = 'error';
                        outputArea.value = 'Could not display the extracted text due to a decoding error.';
                        localStorage.removeItem('extractedText'); // Clear corrupted data
                    }
                } else {
                    statusDiv.textContent = 'Upload a PDF file.'; // Default message
                    statusDiv.className = '';
                }
            }
        });
    </script>

</body>
</html>
